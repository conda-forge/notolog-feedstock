{% set name = "notolog" %}
{% set version = "1.2.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/notolog-{{ version }}.tar.gz
  sha256: 9ebaa227e9633d61c09dd8b03eeaf02a6abbf0ba3e377e88743109a1fe6ec46a

build:
  entry_points:
    - notolog=notolog.app:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - poetry-core >=2.4.1,<3.0.0
  run:
    - python >={{ python_min }},<3.15
    - cryptography >=50.0.0,<51.0.0
    - emoji >=2.15.0,<3.0.0
    - markdown >=3.10.3,<4.0.0
    - numpy >=2.2.0,<3.0.0
    - packaging >=26.3,<27.0
    - psutil >=7.2.2,<8.0.0
    - pygments >=2.21.0,<3.0.0
    - pyside6 >=6.11.2,<6.12.0
    - qasync >=0.28.0,<0.29.0
    - tomli >=2.4.1,<3.0.0
    - tomli-w >=1.2.0,<2.0.0
    - llama-cpp-python >=0.3.35,<0.4.0

test:
  imports:
    - notolog
  requires:
    - pytest
    - python {{ python_min }}
  source_files:
    - tests
  commands:
    - pytest tests/test_pkg_integration.py
    # Package requirements on PyPI differ slightly from those on conda-forge.
    #- pip check

app:
  entry: notolog
  icon: notolog-logo.png
  summary: Cross-platform Markdown editor with optional AI assistance, local LLMs, and file encryption
  own_environment: true

about:
  home: https://notolog.com
  summary: Cross-platform Markdown editor with optional AI assistance, local LLMs, and file encryption
  description: |
    Notolog is an open-source, cross-platform Markdown editor built with Python and PySide6, featuring optional AI assistance, local LLMs, file encryption, and local-first privacy.
  dev_url: https://github.com/notolog/notolog-editor
  doc_url: https://notolog.app
  license: MIT
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - tekkidev
    - notolog
